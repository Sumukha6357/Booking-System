spring:
  application:
    name: platform-api

  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379
      password:

  flyway:
    enabled: true

  security:
    user:
      name: admin
      password: admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081

app:
  env: local
  jwt:
    secret: this_is_a_secure_jwt_secret_key_32chars
    expiry-seconds: 7200
    refresh-expiry-seconds: 1209600
  webhook:
    secret: secure_webhook_secret
  cors:
    allowed-origin: http://localhost:3000

integrations:
  mode: mock
  payment:
    real:
      api-key: 
  email:
    real:
      api-key: 
  sms:
    real:
      api-key: 

logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSX}","level":"%p","corr":"%X{correlationId:-}","tenant":"%X{tenantId:-}","logger":"%c{1}","msg":"%m"}%n'